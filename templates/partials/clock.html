{% load ui_extras %}{% with clock=ticket.sla_clock %}{% if clock %}<span class="clock clock-{{ clock.tone }}{% if wide %} clock-wide{% endif %}"{% if focusable %} tabindex="0"{% endif %} data-tip="Due {{ ticket.get_due_by|date:'d M, H:i' }}. {{ ticket.priority }} priority allows {{ ticket.sla_window_hours }} hours, {{ clock.used }}% used."><span class="track" aria-hidden="true"><span class="track-mark" style="--at: {{ clock.pct|stringformat:'.1f' }}%; --i: {{ index|default:0 }}"></span></span><span class="clock-label">{{ ticket.sla_label }}<span class="visually-hidden">, due {{ ticket.get_due_by|date:'d M, H:i' }}</span></span></span>{% elif ticket.sla_state %}<span class="verdict verdict-{{ ticket.sla_state }}"{% if ticket.due_by %} title="SLA deadline was {{ ticket.get_due_by|date:'d M Y, H:i' }}"{% endif %}>{% icon ticket.sla_icon %}{{ ticket.sla_label }}</span>{% elif ticket.status == 'Pending' %}<span class="verdict verdict-none" title="The SLA clock starts when an Admin sets the priority.">Starts at triage</span>{% else %}<span class="verdict verdict-none">–</span>{% endif %}{% endwith %}
